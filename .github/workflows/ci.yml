# The same three checks AGENTS.md asks for before every merge. Run by hand (Actions → CI → Run workflow): they already
# run locally before each merge, and the repo's Actions minutes are limited.
name: CI
on:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # what prod runs
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w client
