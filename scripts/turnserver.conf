# coturn config for The Deck's voice relay (TURN): calls that can't connect directly (phone hotspots, strict
# NATs) go through the box. scripts/deploy.sh renders this to /etc/turnserver.conf on a prod deploy, filling in
# the box's NetBird address and DECK_TURN_PASSWORD from /etc/the-deck.env, and restarts coturn only when the
# result changed. Reachable over NetBird only: the box has no public address. It relays
# only to NetBird peers, so it can't be used to reach the box's private network or the internet.
listening-ip=@IP@
relay-ip=@IP@
listening-port=3478
min-port=50000
max-port=50199
realm=deck
lt-cred-mech
user=deck:@PASSWORD@
fingerprint
no-tls
no-dtls
no-multicast-peers
no-cli
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
denied-peer-ip=0.0.0.0-255.255.255.255
allowed-peer-ip=10.200.0.0-10.200.255.255
total-quota=200
user-quota=12
stale-nonce=600
syslog
